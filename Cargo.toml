[package]
name = "crashlend"
version = "0.1.0"
edition = "2024"
description = "A simplified lending protocol that replays historical crypto crashes"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "health_factor"
harness = false
